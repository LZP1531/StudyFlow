<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="holoFillCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="holoFillBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#cyberBg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#334155" stroke-width="1"/>

  <circle cx="128" cy="128" r="105" fill="none" stroke="#1E293B" stroke-width="6" stroke-dasharray="2 6"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="8 4 2 4" stroke-opacity="0.6" filter="url(#glowPurple)"/>

  <path d="M 128 23 A 105 105 0 1 1 33 175" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
  <circle cx="33" cy="175" r="5" fill="#FFFFFF" filter="url(#glowCyan)"/>

  <g stroke="#06B6D4" stroke-opacity="0.2" stroke-width="1">
    <line x1="128" y1="23" x2="128" y2="40"/>
    <line x1="128" y1="216" x2="128" y2="233"/>
    <line x1="23" y1="128" x2="40" y2="128"/>
    <line x1="216" y1="128" x2="233" y2="128"/>
  </g>
  <path d="M 60 70 L 64 70 M 62 68 L 62 72" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowPurple)"/>
  <path d="M 190 180 L 194 180 M 192 178 L 192 182" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowPurple)"/>

  <g transform="translate(0, 10)">
    <rect x="75" y="160" width="12" height="25" rx="2" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <rect x="95" y="145" width="12" height="40" rx="2" fill="#06B6D4" fill-opacity="0.4" stroke="#06B6D4" stroke-width="1" filter="url(#glowCyan)"/>
    <rect x="115" y="130" width="12" height="55" rx="2" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1"/>
    <rect x="135" y="150" width="12" height="35" rx="2" fill="#8B5CF6" fill-opacity="0.4" stroke="#8B5CF6" stroke-width="1" filter="url(#glowPurple)"/>
    <rect x="155" y="115" width="12" height="70" rx="2" fill="#06B6D4" fill-opacity="0.6" stroke="#06B6D4" stroke-width="1.5" filter="url(#glowCyan)"/>
  </g>

  <g transform="translate(0, -15)">
    <polygon points="128,60 188,85 128,110 68,85" fill="url(#holoFillBlue)" stroke="#3B82F6" stroke-width="2" filter="url(#glowCyan)"/>

    <line x1="128" y1="60" x2="128" y2="110" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="68" y1="85" x2="188" y2="85" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.5"/>

    <path d="M 88 100 V 125 C 88 140 168 140 168 125 V 100" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 95 110 C 110 118 146 118 161 110" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 3"/>

    <circle cx="128" cy="85" r="4" fill="#FFFFFF" filter="url(#glowCyan)"/>

    <path d="M 128 85 L 175 110 L 175 140" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round" filter="url(#glowPurple)"/>
    <circle cx="175" cy="142" r="3" fill="#A78BFA" filter="url(#glowPurple)"/>
  </g>

  <path d="M 45 170 L 80 135 L 115 150 L 155 105 L 205 125 L 205 170 Z" fill="url(#holoFillCyan)"/>
  <path d="M 45 170 L 80 135 L 115 150 L 155 105 L 205 125" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linejoin="round" filter="url(#glowCyan)"/>

  <circle cx="80" cy="135" r="4" fill="#FFFFFF" filter="url(#glowCyan)"/>
  <circle cx="115" cy="150" r="4" fill="#FFFFFF" filter="url(#glowCyan)"/>
  <circle cx="155" cy="105" r="5" fill="#FFFFFF" filter="url(#glowCyan)"/>
  <circle cx="205" cy="125" r="4" fill="#FFFFFF" filter="url(#glowCyan)"/>

  <g transform="translate(155, 105)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowPurple)"/>
    <line x1="-14" y1="0" x2="-6" y2="0" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="6" y1="0" x2="14" y2="0" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="0" y1="-14" x2="0" y2="-6" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="0" y1="6" x2="0" y2="14" stroke="#8B5CF6" stroke-width="1.5"/>
  </g>
</svg>
